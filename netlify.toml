[build]
  publish = "."
  functions = "netlify/functions"

# (1136) The page itself is never kept by phones, so a new upload shows up on the next open.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# (1136) The board's code files. A file's name changes whenever its contents change,
# so phones can keep each one for a year and never mix old and new pieces.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The server code lives in the same folder as the website. Never serve it as a web page.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[functions.grade]
  schedule = "*/5 * * * *"
