[build]
  command = "true"
  publish = "."
  functions = "netlify/functions"

[functions."odds-refresh"]
  schedule = "*/2 * * * *"

[functions."odds-morning"]
  schedule = "0 11 * * *"

[[redirects]]
  from = "/api/kalshi"
  to = "/.netlify/functions/kalshi"
  status = 200

[[redirects]]
  from = "/api/odds"
  to = "/.netlify/functions/odds"
  status = 200
